<title>Tommy English | Ordering at the Coffee Shop</title>
<style>
:root{
 --navy:#063b60;--blue:#0876ad;--gold:#f8ad22;--white:#fff;
 --coffee:#754c35;--espresso:#432b20;--latte:#ead9c5;--cream:#fbf8f3;
 --sage:#718b68;--ink:#1f2933;--muted:#66727e;--line:#e7e1d9;
 --shadow:0 18px 50px rgba(31,42,52,.12);--radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef1f4;color:var(--ink);font-family:"Times New Roman",Georgia,serif}
button{font:inherit;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:76px;background:var(--white);display:flex;align-items:center;gap:18px;padding:10px clamp(14px,3vw,36px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.logo{width:138px;max-height:58px;object-fit:contain;object-position:left center;flex-shrink:0}
.brand-divider{height:38px;width:1px;background:var(--line)}
.top-title{min-width:0}
.top-title strong{display:block;color:var(--navy);font-size:clamp(15px,1.6vw,20px);letter-spacing:.03em}
.top-title span{font:12px Arial,sans-serif;color:var(--muted)}
.top-spacer{flex:1}
.lesson-tag{font:11px Arial,sans-serif;letter-spacing:.1em;color:var(--coffee);background:#f4e9dc;padding:8px 11px;border-radius:999px;white-space:nowrap}
main{width:100%;flex:1;display:flex;justify-content:center;align-items:stretch;padding:clamp(10px,2vw,24px)}
.stage{width:min(1500px,100%);min-height:min(780px,calc(100vh - 158px));background:var(--cream);border:1px solid #e8e0d6;border-radius:26px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column}
.stage:before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(var(--gold),var(--blue));opacity:.9}
.slide-content{flex:1;padding:clamp(22px,4vw,58px);display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1;min-height:0}
.eyebrow{font:700 12px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(34px,5.3vw,68px);line-height:1.02;color:var(--navy);margin-bottom:18px}
h2{font-size:clamp(28px,4vw,46px);line-height:1.08;color:var(--navy);margin-bottom:18px}
h3{font-size:clamp(21px,2.4vw,29px);color:var(--coffee);margin-bottom:10px}
p{font-size:clamp(18px,2vw,23px);line-height:1.4}
.lead{font-size:clamp(19px,2.4vw,27px);color:#52616d;max-width:850px}
.small{font-size:16px;color:var(--muted)}
.kicker{font:700 12px Arial,sans-serif;letter-spacing:.1em;color:var(--coffee);text-transform:uppercase}
.hero{background:radial-gradient(circle at 82% 22%,#f6d68d 0 7%,transparent 7.5%),linear-gradient(120deg,#fff 0%,#fbf4e9 62%,#ead7bf 100%)}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.coffee-art{min-height:300px;border-radius:30px;background:linear-gradient(145deg,#d9b58e,#8a5b3e);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff55}
.cup{width:190px;height:145px;background:#fff8ed;border-radius:12px 12px 70px 70px;position:relative;box-shadow:0 20px 28px #432b2040;display:grid;place-items:center;color:var(--coffee);font-size:52px}
.cup:after{content:"";position:absolute;right:-48px;top:26px;width:58px;height:62px;border:15px solid #fff8ed;border-left:0;border-radius:0 45px 45px 0}
.cup:before{content:"";position:absolute;top:-12px;left:0;right:0;height:22px;background:#4b2e20;border-radius:50%}
.steam{position:absolute;top:40px;font-size:50px;color:#fff9;letter-spacing:18px}
.decor{position:absolute;font-size:38px;opacity:.85}
.decor.d1{top:24px;left:25px}.decor.d2{bottom:24px;right:30px}
.btn{border:0;border-radius:13px;padding:13px 19px;font:700 15px Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.18s ease;box-shadow:0 5px 14px #122b3d12}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.primary{background:var(--navy);color:white}.gold{background:var(--gold);color:#38250f}.outline{background:white;color:var(--navy);border:1px solid #cbd6de;box-shadow:none}.soft{background:#f2e7da;color:var(--coffee);box-shadow:none}.success{background:#e5efe1;color:#385a32}.danger{background:#f8e7e4;color:#8a332a}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:white;border:1px solid var(--line);border-radius:19px;padding:clamp(15px,2vw,23px);box-shadow:0 7px 22px #2737460b;transition:.2s}
.card.interactive{cursor:pointer}.card.interactive:hover{transform:translateY(-4px);border-color:#d2ad7c;box-shadow:0 14px 28px #27374614}
.card.selected{outline:3px solid var(--gold);background:#fffaf0}
.icon{font-family:Arial,sans-serif;font-size:clamp(34px,4vw,55px);line-height:1.1;margin-bottom:10px}
.card h3{font-size:clamp(20px,2.2vw,27px)}
.question-card{min-height:145px;display:flex;flex-direction:column;justify-content:center}
.question-card .qnum{font:700 11px Arial,sans-serif;color:var(--blue);letter-spacing:.12em;margin-bottom:10px}
.reveal{display:none;margin-top:13px;padding:13px 15px;background:#f4ecdf;border-left:4px solid var(--gold);border-radius:10px;font-size:19px}
.reveal.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#eaf2f7;color:var(--navy);font:700 11px Arial,sans-serif;letter-spacing:.07em}
.drink-choice{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.choice{padding:12px 17px;border:1px solid #d8d2c9;background:#fff;border-radius:12px;color:var(--coffee);font-size:18px}
.choice.active{border:2px solid var(--blue);background:#edf6fb;color:var(--navy);font-weight:bold}
.flashcard{max-width:700px;margin:auto;text-align:center;width:100%}
.flash-image{height:clamp(150px,25vh,240px);display:grid;place-items:center;background:linear-gradient(135deg,#f4e8d8,#fff);border-radius:22px;font-size:clamp(75px,12vw,125px);margin-bottom:20px}
.word{font-size:clamp(34px,5vw,54px);color:var(--navy);font-weight:bold}
.ipa{font:16px Arial,sans-serif;color:var(--muted);margin:7px}
.menu-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.menu-item{border:1px solid var(--line);border-radius:16px;background:white;padding:12px;text-align:center;cursor:pointer;transition:.18s}
.menu-item:hover{transform:translateY(-3px);border-color:var(--gold)}
.menu-item .food{font-size:40px}.menu-item strong{display:block;font-size:20px;color:var(--coffee)}.menu-item small{font:13px Arial,sans-serif;color:var(--muted)}
.dialogue{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.speech{padding:16px;border-radius:16px;background:#f0e5d8;margin:8px 0;font-size:clamp(17px,2vw,22px);line-height:1.35}
.speech.customer{background:#e8f1f6}
.speaker{font:700 11px Arial,sans-serif;letter-spacing:.1em;color:var(--coffee);text-transform:uppercase}
.speech.customer .speaker{color:var(--blue)}
.step{border:1px solid var(--line);border-radius:16px;padding:15px;background:white}
.step.active{border:2px solid var(--gold);background:#fffaf0}
.blank{display:inline-block;min-width:105px;border-bottom:2px dashed var(--coffee);color:var(--blue);font-weight:bold;text-align:center}
.selectable{cursor:pointer}.selectable:hover{background:#fff7e8}
.order-summary{background:var(--navy);color:white;border-radius:18px;padding:18px}
.order-summary h3{color:#fff}.order-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff30;font-size:17px}
.feedback{padding:13px 15px;border-radius:12px;background:#eaf2e7;color:#365d32;margin-top:12px}
.toolbar{background:#fff;border-top:1px solid var(--line);padding:12px clamp(12px,2.5vw,28px);display:flex;align-items:center;gap:10px;position:sticky;bottom:0;z-index:20}
.progress-wrap{flex:1;min-width:80px}.progress-label{display:flex;justify-content:space-between;font:11px Arial,sans-serif;color:var(--muted);margin-bottom:6px}
.progress{height:6px;background:#e8e8e8;border-radius:20px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width .25s}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--navy);font:700 18px Arial,sans-serif}
.icon-btn:hover{background:#edf5fa}
.menu-overlay{position:fixed;inset:0;background:#0b1e2c77;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.menu-overlay.open{display:flex}.menu-panel{background:white;border-radius:22px;padding:24px;max-width:720px;width:100%;max-height:80vh;overflow:auto}
.slide-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slide-link{padding:13px;border:1px solid var(--line);background:#fafafa;border-radius:12px;text-align:left;color:var(--navy)}
.slide-link.current{border:2px solid var(--gold);background:#fff8e9}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#142b3a;color:white;padding:11px 17px;border-radius:999px;font:14px Arial,sans-serif;z-index:90;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
.hidden{display:none!important}
footer.note{text-align:center;padding:7px;color:#78838d;font:11px Arial,sans-serif}
@media(max-width:850px){
 .hero-grid{grid-template-columns:1fr}.coffee-art{min-height:210px}
 .grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media(max-width:560px){

 .slide-content{padding:22px 17px 28px}
 .grid.two,.grid.three{grid-template-columns:1fr}
 .grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}

 .toolbar .btn .wordlabel{display:none}.icon-btn{width:38px;height:38px}
 .slide-list{grid-template-columns:repeat(2,1fr)}
 .coffee-art{min-height:175px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.flashcard #meaning{font-size:clamp(22px,2.3vw,30px)!important}
.flashcard .row{margin-top:6px!important;gap:7px;justify-content:center}
.flashcard .btn{padding:9px 12px;font-size:13px}
.flashcard p.small{margin-top:5px!important;margin-bottom:0;font-size:13px}
/* Quiz: for What is this? the photograph sits beside the question, not below it. */
.quiz-prompt{display:flex;align-items:center;justify-content:center;gap:22px;margin:2px 0 12px;min-height:0}
.quiz-prompt .lead{margin:0;font-weight:700;color:var(--coffee);flex:0 1 auto}
.quiz-question-photo{height:clamp(125px,24dvh,225px);width:clamp(105px,17vw,180px);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fffaf2;border:2px solid #e8d1b7;border-radius:17px;padding:5px}
.quiz-question-photo img{height:100%;width:100%;object-fit:contain;object-position:center}
.grid.four .photo-option{height:clamp(115px,23dvh,210px)!important}
.grid.four:has(.photo-option){gap:10px}
@media(max-height:750px) and (min-width:700px){
 .topbar{height:55px!important;min-height:55px}.logo{max-height:47px!important;width:125px!important}
 .slide-content{padding:8px 22px!important}
 h2{font-size:clamp(23px,2.5vw,32px)!important;margin-bottom:6px!important}
 .flashcard .photo-frame{height:clamp(135px,29dvh,230px)!important;max-width:240px!important}
 .flashcard .row{margin-top:3px!important}
 .toolbar{min-height:46px;padding:3px 12px!important}
 .quiz-question-photo{height:clamp(105px,20dvh,160px)}
}
@media(max-width:600px){
 .topbar{height:57px!important;min-height:57px;padding:4px 8px!important}
 .logo{width:105px!important;max-height:47px!important}
 .top-title strong{font-size:12px!important}
 .slide-content{padding:10px 12px!important}
 .flashcard .photo-frame{height:clamp(145px,29dvh,260px)!important;max-width:230px!important}
 .flashcard .row{gap:5px}.flashcard .btn{padding:8px 9px;font-size:12px}
 .quiz-prompt{gap:10px}.quiz-question-photo{height:clamp(115px,22dvh,165px);width:115px}
 .toolbar{min-height:47px}
}


/* V5: use the available projection area on sparse slides without enlarging dense slides. */
@media (min-width: 850px) and (min-height: 650px){
 .stage[data-slide="1"] .slide-content{justify-content:center!important}
 .stage[data-slide="1"] .hero-grid{width:min(1320px,96%);margin:auto;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,85px);align-items:center}
 .stage[data-slide="1"] h1{font-size:clamp(54px,5.6vw,88px)!important;line-height:1.05}
 .stage[data-slide="1"] .lead{font-size:clamp(25px,2.2vw,34px)}
 .stage[data-slide="1"] .coffee-art{min-height:clamp(320px,52vh,560px)}
 .stage[data-slide="1"] .btn{font-size:clamp(18px,1.4vw,23px);padding:17px 27px}
 .stage[data-slide="2"] .slide-content,.stage[data-slide="3"] .slide-content,.stage[data-slide="4"] .slide-content,.stage[data-slide="5"] .slide-content,.stage[data-slide="11"] .slide-content,.stage[data-slide="12"] .slide-content{justify-content:center!important}
 .stage[data-slide="2"] .grid.two{gap:clamp(16px,2vw,30px)}
 .stage[data-slide="2"] .question-card{min-height:clamp(155px,22vh,230px)}
 .stage[data-slide="3"] .photo-option{height:clamp(190px,33vh,340px)!important}
 .stage[data-slide="3"] .grid.four{gap:clamp(12px,1.7vw,24px)}
 .stage[data-slide="4"] .flashcard .photo-frame{height:clamp(240px,43vh,420px)!important;max-width:380px!important}
 .stage[data-slide="4"] .flashcard{max-width:820px}
 .stage[data-slide="4"] .flashcard .word{font-size:clamp(34px,3.5vw,51px)}
 .stage[data-slide="4"] .flashcard .ipa{font-size:clamp(23px,2.2vw,30px)!important}
 .stage[data-slide="4"] .flashcard .btn{font-size:clamp(14px,1.2vw,18px);padding:11px 16px}
 .stage[data-slide="5"] .grid.four .photo-option{height:clamp(180px,31vh,310px)!important}
 .stage[data-slide="5"] .quiz-question-photo{height:clamp(180px,29vh,280px);width:clamp(145px,17vw,235px)}
 .stage[data-slide="5"] .quiz-prompt .lead{font-size:clamp(25px,2.6vw,38px)}
 .stage[data-slide="11"] .card{padding:clamp(20px,2.5vw,36px)}
}
@media (min-width:850px) and (max-height:740px){
 .stage[data-slide="4"] .flashcard .photo-frame{height:clamp(180px,34vh,270px)!important;max-width:280px!important}
 .stage[data-slide="3"] .photo-option{height:clamp(140px,25vh,225px)!important}
 .stage[data-slide="5"] .grid.four .photo-option{height:clamp(130px,24vh,210px)!important}
 .stage[data-slide="1"] .coffee-art{min-height:clamp(240px,43vh,340px)}
}
@media (max-width:849px){
 .stage[data-slide="1"] .hero-grid{align-items:center}
 .stage[data-slide="4"] .flashcard .photo-frame{height:clamp(185px,35dvh,310px)!important;max-width:300px!important}
}

/* Keep the welcome title on exactly two deliberate lines. */
.stage[data-slide="1"] h1.welcome-title{font-size:clamp(34px,4vw,66px)!important;line-height:1.12;letter-spacing:-.025em}
.welcome-title-line{display:block;white-space:nowrap}
@media(max-width:849px){.stage[data-slide="1"] h1.welcome-title{font-size:clamp(30px,6.4vw,60px)!important}}
@media(max-width:430px){.stage[data-slide="1"] h1.welcome-title{font-size:clamp(27px,6.2vw,36px)!important}}
</style>

let cachedVoices=[];
function refreshVoices(){if('speechSynthesis' in window)cachedVoices=window.speechSynthesis.getVoices()||[];}
if('speechSynthesis' in window){refreshVoices();window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);}
function say(text,preferFemale=false){
 if(!('speechSynthesis' in window)){toast('Audio is unavailable in this browser. Try Chrome or Edge.');return;}
 const synth=window.speechSynthesis;
 try{
  synth.cancel();synth.resume();refreshVoices();
  const utter=new SpeechSynthesisUtterance(String(text));utter.lang='en-US';utter.rate=.88;utter.pitch=preferFemale?1.15:1.05;utter.volume=1;
  const english=cachedVoices.filter(v=>/^en[-_]/i.test(v.lang));
  const female=english.find(v=>/jenny|aria|zira|samantha|ava|victoria|karen|susan|female/i.test(v.name));
  utter.voice=(preferFemale?female:null)||english.find(v=>/en[-_]US/i.test(v.lang))||english[0]||null;
  utter.onerror=()=>toast('Could not play voice. Check device audio and browser voices.');
  synth.speak(utter);
 }catch(err){toast('Audio could not start: '+err.message);}
}
function sayEncoded(encoded,preferFemale=false){say(decodeURIComponent(encoded),preferFemale)}
function playFeedback(correct){
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=window._feedbackAudioCtx||(window._feedbackAudioCtx=new C());ctx.resume();
 const tones=correct?[[660,0,.11],[880,.12,.15]]:[[260,0,.18],[185,.19,.2]];
 tones.forEach(([freq,delay,duration])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=correct?'sine':'triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+duration);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+duration+.01);});
 }catch(e){/* visuals still work if WebAudio is blocked */}
}
function reveal(id){save();$(id).classList.toggle("show");}
function welcome(){$("slide").innerHTML=`
 <div class="hero-grid"><div><div class="eyebrow">WELCOME TO TOMMY ENGLISH</div><h1 class="welcome-title"><span class="welcome-title-line">Ordering at the</span><span class="welcome-title-line" style="color:var(--coffee)">Coffee Shop</span></h1><p class="lead">Let's learn how to order food and drinks in English!</p><div class="row" style="margin-top:24px"><span class="pill">MID-A1</span><span class="pill">45 MINUTES</span></div><button class="btn gold" style="margin-top:28px" onclick="go(1)">Start lesson <span>→</span></button></div><div class="coffee-art"><div class="steam">〰 〰</div><div class="cup">☕</div><span class="decor d1">✦</span><span class="decor d2">☕</span></div></div>`;}
const questionTexts=["How are you today?","Where are you from?","What is your job?","What do you like doing in your free time?"];
function toggleQuestion(el,q){save();if(el.classList.contains("question-mask")){el.classList.remove("question-mask");el.classList.add("answer-box");el.textContent=q;}else{el.classList.add("question-mask");el.classList.remove("answer-box");el.textContent="Tap to reveal ✦";}}
function getting(){$("slide").innerHTML=`
 <div class="eyebrow">STAGE 1 · ICE-BREAKING & SMALL TALK · 5 MIN</div><h2>Let's get to know each other! ✨</h2><p class="lead">Click a card to reveal a question.</p>
 <div class="grid two" style="margin-top:14px">${["How are you today?","Where are you from?","What is your job?","What do you like doing in your free time?"].map((q,i)=>`<div class="card question-card"><div class="qnum">QUESTION 0${i+1} · ${['😊','🌍','💼','🎨'][i]}</div><div class="question-mask" id="get${i}" onclick="toggleQuestion(this,questionTexts[${i}])">Tap to reveal ✦</div></div>`).join("")}</div>`;}

function coffeeTalk(){$("slide").innerHTML=`
 <div class="eyebrow">STAGE 1 · COFFEE TALK · 5 MIN</div><h2>Let's talk about drinks! ☕</h2>
 <div class="grid four">${['Coffee','Juice','Tea','Milk'].map(n=>`<div class="card"><div class="photo-option"><img alt="Drink photograph" src="${photos[n]}"></div></div>`).join('')}</div>
 <div class="grid two" style="margin-top:18px">${["Do you like coffee?","What is your favourite drink?","Do you like hot or iced drinks?","Do you go to the coffee shop with your friends?"].map((q,i)=>`<div class="card"><div class="kicker">QUESTION ${i+1}</div><button class="btn soft" onclick="reveal('cq${i}')">Reveal question</button><div class="reveal" id="cq${i}">${q}</div><button class="btn outline" style="margin-top:9px" onclick="reveal('ch${i}')">Reveal answer hint</button><div class="reveal" id="ch${i}">${['Yes, I do. / No, I don’t.','My favourite drink is ...','I like hot / iced drinks.','Yes, I do. / No, I don’t.'][i]}</div></div>`).join('')}</div>
 <div style="margin-top:15px"><button class="btn gold" onclick="reveal('topic-reveal')">Reveal today’s topic ✨</button><div class="reveal" id="topic-reveal">Today, we're learning how to order food and drinks at a coffee shop!</div></div>`;}

function chooseDrink(n,el){save();document.querySelectorAll(".grid.four .card").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");$("coffee-question").textContent=n==="Coffee"?"Do you like coffee?":`Is ${n.toLowerCase()} your favorite drink?`;}
function choosePreference(el,msg){save();document.querySelectorAll(".choice").forEach(x=>x.classList.remove("active"));el.classList.add("active");$("coffee-response").textContent=msg;}
function vocabSlide(){const v=vocab[vocabIndex];$("slide").innerHTML=`
 <div class="eyebrow">STAGE 2 · VOCABULARY PRESENTATION · 7 MIN</div><h2 style="text-align:center">Look, listen & repeat! ✨</h2><div class="flashcard">
 <div class="photo-frame"><img class="photo-food" src="${photos[v.word]}" alt="Vocabulary photograph"></div>
 <div class="reveal" id="vword"><div class="word">${v.word}</div><div class="ipa">${v.ipa}</div></div>
 <div class="reveal" id="meaning" style="font-size:clamp(25px,3vw,38px)">${v.meaning}</div>
 <div class="row" style="justify-content:center;margin-top:18px"><button class="btn gold" onclick="reveal('vword')">Reveal word</button><button class="btn soft" onclick="reveal('meaning')">Reveal meaning</button><button class="btn outline" onclick="say('${v.word}')">🔊 Listen</button><button class="btn primary" onclick="nextVocab()">Next word →</button></div>
 <p class="small" style="margin-top:14px">Word ${vocabIndex+1} / ${vocab.length} · Guess, reveal, listen and repeat.</p></div>`;}

function nextVocab(){save();vocabIndex=(vocabIndex+1)%vocab.length;vocabSlide();}
function quickCheck(){const questions=[
 {kind:'picture',target:'Tea',options:['Tea','Coffee','Milk','Water']},
 {kind:'picture',target:'Juice',options:['Coffee','Juice','Water','Tea']},
 {kind:'picture',target:'Cookie',options:['Cake','Sandwich','Cookie','Milk']},
 {kind:'word',target:'Coffee',options:['Tea','Coffee','Juice','Water']},
 {kind:'word',target:'Sandwich',options:['Cake','Cookie','Sandwich','Milk']},
 {kind:'word',target:'Milk',options:['Water','Tea','Juice','Milk']}];
 const q=questions[qIndex%questions.length];$("slide").innerHTML=`
 <div class="eyebrow">STAGE 2 · QUICK VOCABULARY CHECK · 3 MIN</div><div class="row between"><h2>Look & choose! 🌟</h2><span class="pill">QUESTION ${qIndex%6+1} / 6</span></div>
 <div class="quiz-prompt"><p class="lead">${q.kind==='picture'?`Which picture is ${q.target}?`:'What is this?'}</p>
 ${q.kind==='word'?`<div class="quiz-question-photo"><img src="${photos[q.target]}" alt="Identify the pictured food or drink"></div>`:''}</div>
 <div class="grid four">${q.options.map(n=>`<button class="card interactive" style="border:2px solid var(--line);font-family:inherit" onclick="checkVocab('${n}','${q.target}',this)">${q.kind==='picture'?`<div class="photo-option"><img src="${photos[n]}" alt="Answer option"></div>`:`<h3 style="margin:12px 0">${n}</h3>`}</button>`).join('')}</div>
 <div id="quiz-feedback" class="feedback hidden" aria-live="polite"></div>
 <div class="row between" style="margin-top:18px"><span class="small">Choose an answer, then continue.</span><button class="btn primary" onclick="save();qIndex=(qIndex+1)%6;quickCheck()">Next question →</button></div>`;}

function checkVocab(n,a,el){save();playFeedback(n===a);document.querySelectorAll(".grid.four .card").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");const f=$("quiz-feedback");f.classList.remove("hidden");f.textContent=n===a?"✓ Excellent! That's correct.":"Not quite. Try again!";f.style.background=n===a?"#eaf2e7":"#f8e7e4";f.style.color=n===a?"#365d32":"#8a332a";}
function expressions(){
 const groups=[
 {title:'1 · ORDERING',barista:[['BARISTA ASKS','What would you like?']],customer:[['CUSTOMER ANSWERS','I would like a coffee, please.']]},
 {title:'2 · CHOOSING A SIZE',barista:[['BARISTA ASKS','What size do you want? Large, medium or small?']],customer:[['CUSTOMER ANSWERS','Large/Medium/Small, please.']]},
 {title:'3 · FOR HERE OR TO GO',barista:[['BARISTA ASKS','For here or to go?']],customer:[['OPTION 1','For here, please.'],['OPTION 2','To go, please.']]},
 {title:'4 · FINISHING AN ORDER',barista:[['BARISTA ASKS','Anything else?'],['BARISTA SAYS','It’s $14, please.']],customer:[['CUSTOMER ANSWERS','That’s all, thank you.'],['CUSTOMER PAYS','Here you are. Thank you.']]}
 ];
 const baristaBlock=([label,line])=>`<div class="expression-barista"><div class="kicker">☕ ${label}</div><div class="expression-line">${line}</div><button class="btn outline" onclick="sayEncoded('${encodeURIComponent(line)}',true)">🔊 Listen</button></div>`;
 const customerBlock=([label,line],g,i)=>`<div><button class="btn soft" onclick="reveal('exp${g}-${i}')">✦ Reveal ${label.toLowerCase()}</button><div class="reveal" id="exp${g}-${i}"><div class="kicker">🙂 ${label}</div><div class="expression-line">${line}</div><button class="btn outline" onclick="sayEncoded('${encodeURIComponent(line)}')">🔊 Listen</button></div></div>`;
 $('slide').innerHTML=`<div class="eyebrow">STAGE 3 · USEFUL EXPRESSIONS · 10 MIN</div><h2>Let's order politely! 💬</h2><p class="lead">Read the barista's line, then reveal the customer's response.</p><div class="grid two expression-grid">${groups.map((g,j)=>`<div class="card"><span class="pill">${g.title}</span><div class="expression-inner">${j===3?baristaBlock(g.barista[0])+customerBlock(g.customer[0],j,0)+baristaBlock(g.barista[1])+customerBlock(g.customer[1],j,1):g.barista.map(baristaBlock).join('')+g.customer.map((x,i)=>customerBlock(x,j,i)).join('')}</div></div>`).join('')}</div>`;
}
function sampleDialogue(){const barista=['Hello! What would you like?','What size do you want? Large, medium or small?','Sure! Anything else?','Of course. For here or to go?','It’s $14, please.','Your order will be ready in a few minutes.'];const customer=['I would like a coffee, please.','Medium, please.','A sandwich, please.','For here, please.','Here you are. Thank you.','Thank you.'];$("slide").innerHTML=`
 <div class="eyebrow">STAGE 3 · SAMPLE DIALOGUE</div><h2>At the coffee shop 💬</h2><p class="lead">Listen to the barista one line at a time. Practise the customer’s lines.</p>
 <div class="dialogue"><div><div class="kicker">☕ BARISTA</div>${barista.map((x,i)=>`<div class="dialogue-line" id="bar${i}">${x}</div>`).join('')}</div><div><div class="kicker">🙂 CUSTOMER</div>${customer.map((x,i)=>`<div class="dialogue-line customer" id="customer${i}" onclick="save();this.classList.remove('hidden-text')">${x}</div>`).join('')}</div></div>
 <div class="row" style="margin-top:18px"><button class="btn gold" onclick="playBaristaLine()">🔊 Play next barista line</button><button class="btn soft" onclick="hideNextCustomer()">🙈 Hide next customer line</button><button class="btn outline" onclick="save();baristaIndex=0;hideCustomerIndex=0;document.querySelectorAll('.customer').forEach(x=>x.classList.remove('hidden-text'));toast('Dialogue reset')">Reset practice</button></div>
 <p class="small">Click any hidden customer box to reveal that sentence again.</p>`;}

function playBaristaLine(){const lines=['Hello! What would you like?','What size do you want? Large, medium or small?','Sure! Anything else?','Of course. For here or to go?','It’s $14, please.','Your order will be ready in a few minutes.'];save();const i=baristaIndex%lines.length;document.querySelectorAll('[id^=bar]').forEach(x=>x.style.outline='none');$('bar'+i).style.outline='3px solid #f6b638';sayFemale(lines[i]);baristaIndex++;}
function sayFemale(text){say(text,true);}
function hideNextCustomer(){save();for(let k=0;k<6;k++){const i=(hideCustomerIndex+k)%6;if(!$('customer'+i).classList.contains('hidden-text')){$('customer'+i).classList.add('hidden-text');hideCustomerIndex=(i+1)%5;return;}}toast('All customer lines are hidden.');}
function guided(){$('slide').innerHTML=`
 <div class="eyebrow">STAGE 4 · GUIDED SPEAKING PRACTICE · 5 MIN</div><h2>Complete the conversation! ✍️</h2>
 <div class="order-grid"><div><img class="menu-photo" src="${menuPhoto}" alt="Original Tommy Cafe menu" onclick="zoomMenu()"><p class="small">Tap the menu to enlarge it.</p></div>
 <div class="card guided-dialogue"><div class="kicker">DIALOGUE · SARAH</div>
 ${[['Barista','Good morning! What would you like?'],['Sarah','I would like a <span class="blank">________</span>, please.'],['Barista','Sure! Anything else?'],['Sarah','Yes, a <span class="blank">________</span>, please.'],['Barista','For here or to go?'],['Sarah','<span class="blank">________</span>, please.'],['Barista','It’s <span class="blank">________</span>, please.'],['Sarah','Here you are. Thank you!']].map(([who,line])=>`<div class="guided-line ${who==='Sarah'?'customer':''}"><strong>${who}:</strong> ${line}</div>`).join('')}
 <p class="small" style="margin:10px 0 0">Sarah fills in the blanks aloud. The teacher says the price.</p></div></div>`;}
function pickMenu(n){save();if(drinks.some(x=>x[0]===n))selectedDrink=n;else selectedFood=n;guided();}
function pickTakeaway(n){save();takeaway=n;guided();}
function price(n){return [...drinks,...foods].find(x=>x[0]===n)[2]}
function checkGuided(){save();const total=price(selectedDrink)+price(selectedFood);$("guided-total").textContent=`Your order costs $${total}. ${total===7?"Great! Your order matches the $7 dialogue.":"Choose another combination to make $7."}`;$("guided-total").style.background=total===7?"#e5efe1":"#f8eee1";}
function roleMenu(){const total=Object.entries(order).reduce((a,[n,q])=>a+price(n)*q,0);$("slide").innerHTML=`
 <div class="eyebrow">STAGE 5 · ROLE-PLAY · 7 MIN</div><h2>Welcome to Tommy Cafe! ☕</h2>
 <div class="order-grid"><div><img class="menu-photo" src="${menuPhoto}" alt="Original Tommy Cafe menu" onclick="zoomMenu()"><p class="small">Tap the menu to enlarge it.</p></div>
 <div class="card"><h3>🧾 Take an order</h3><div class="order-list">${[...drinks,...foods].map(([n,e,p])=>`<button class="order-btn" onclick="addOrder('${n}')"><img src="${photos[n]}" alt=""><span>${n}</span><span class="price">$${p}</span></button>`).join('')}</div>
 <div class="order-summary" style="margin-top:14px"><h3 style="margin-bottom:6px">Your order</h3>${Object.keys(order).length?Object.entries(order).map(([n,q])=>`<div class="order-line"><span>${n} × ${q}</span><span>$${price(n)*q} <button style="background:#fff3;border:0;color:white;border-radius:5px;cursor:pointer" onclick="removeOrder('${n}')" aria-label="Remove one ${n}">−</button></span></div>`).join(''):'<p style="font-size:17px;color:#fff9">Choose an item to start.</p>'}<div class="order-line" style="font-size:25px;border:0"><strong>Total</strong><strong>$${total}</strong></div></div>
 <div class="row" style="margin-top:12px"><button class="btn outline" onclick="save();order={};roleMenu()">Clear order</button><button class="btn gold" onclick="go(9)">Start conversation →</button></div></div></div>
 <div class="card" style="margin-top:16px"><div class="row between"><h3 style="margin:0">💡 Useful expressions</h3><button class="btn soft" onclick="reveal('role-menu-hints')">Reveal / hide hints</button></div><div class="reveal" id="role-menu-hints">I would like a coffee, please. · Anything else? · For here or to go? · How much is it? · That’s all, thank you. · Here you are. Thank you.</div></div>`;}

function addOrder(n){save();order[n]=(order[n]||0)+1;roleMenu();}
function removeOrder(n){save();order[n]--;if(order[n]<=0)delete order[n];roleMenu();}
function zoomMenu(){const w=window.open('','_blank');if(w){w.document.write('<html><title>Tommy Cafe Menu</title><body style="margin:0;background:#fff;display:grid;place-items:center;min-height:100vh"><img src="'+menuPhoto+'" style="max-width:100%;height:auto"></body></html>');w.document.close();}else toast('Allow pop-ups to enlarge the menu.');}
function chooseRoleItem(type,n){save();if(type==="drink")selectedDrink=n;else selectedFood=n;roleMenu();}
function pickRoleTakeaway(n){save();takeaway=n;roleMenu();}
const roleLines=[
 ["BARISTA","Hello! What would you like?","CUSTOMER","I would like a [drink], please."],
 ["BARISTA","Sure! Anything else?","CUSTOMER","Yes, a [food], please."],
 ["BARISTA","For here or to go?","CUSTOMER","[For here / To go], please."],
 ["BARISTA","It's [price], please.","CUSTOMER","Here you are. Thank you."]
];
function roleplay(){const x=roleLines[roleIndex];const orderedDrinks=Object.keys(order).filter(n=>drinks.some(d=>d[0]===n));const orderedFoods=Object.keys(order).filter(n=>foods.some(d=>d[0]===n));const d=orderedDrinks[0]||selectedDrink;const f=orderedFoods[0]||selectedFood;const priceTotal=Object.keys(order).length?Object.entries(order).reduce((a,[n,q])=>a+price(n)*q,0):price(d)+price(f);const customer=x[3].replace("[drink]",d.toLowerCase()).replace("[food]",f.toLowerCase()).replace("[For here / To go]",takeaway).replace("[price]","$"+priceTotal);
$("slide").innerHTML=`
 <div class="eyebrow">STAGE 5 · ROLE-PLAY · CUSTOMER & BARISTA</div><div class="row between"><h2 style="margin:0">Let's role-play!</h2><span class="pill">TURN ${roleIndex+1} / 4</span></div><p class="lead">Teacher = Barista · Sarah = Customer</p>
 <div class="grid two" style="margin-top:14px"><div class="step active"><div class="speaker">☕ ${x[0]}</div><p style="font-size:clamp(20px,2.5vw,28px);margin:12px 0">${x[1].replace("[price]","$"+priceTotal)}</p><button class="btn outline" onclick="playRoleLine('barista')">🔊 Play barista line</button></div>
 <div class="step"><div class="speaker">🙂 ${x[2]}</div><p style="font-size:clamp(20px,2.5vw,28px);margin:12px 0">${customer}</p><button class="btn outline" onclick="playRoleLine('customer')">🔊 Listen to model</button></div></div>
 <div class="card" style="margin-top:15px"><div class="row between"><div><div class="kicker">HINTS</div><p class="small" style="margin:5px 0">Open or hide the suggested customer response.</p></div><button class="btn soft" onclick="save();$('role-hint').classList.toggle('show')">Show / hide hint</button></div><div class="reveal" id="role-hint">${customer}</div></div>
 <div class="row between" style="margin-top:18px"><button class="btn outline" onclick="save();roleIndex=0;roleplay()">Restart role-play</button><button class="btn primary" onclick="save();if(roleIndex<3){roleIndex++;roleplay()}else{toast('Role-play completed!');go(10)}">${roleIndex===3?"Finish role-play ✓":"Next turn →"}</button></div>`;}
function playRoleLine(who){const x=roleLines[roleIndex];const orderedDrinks=Object.keys(order).filter(n=>drinks.some(d=>d[0]===n));const orderedFoods=Object.keys(order).filter(n=>foods.some(d=>d[0]===n));const d=orderedDrinks[0]||selectedDrink,f=orderedFoods[0]||selectedFood;const total=Object.keys(order).length?Object.entries(order).reduce((a,[n,q])=>a+price(n)*q,0):price(d)+price(f);const line=who==='barista'?x[1].replace('[price]','$'+total):x[3].replace('[drink]',d.toLowerCase()).replace('[food]',f.toLowerCase()).replace('[For here / To go]',takeaway);say(line,who==='barista');}
function wrapup(){$("slide").innerHTML=`
 <div class="eyebrow">STAGE 6 · WRAP-UP · 2 MIN</div><h2>What have we learned today?</h2><p class="lead">Answer these three review questions.</p><div class="grid three" style="margin-top:16px">
 ${[["01","How do you order a drink?","I would like a coffee, please."],["02","What do S, M, and L stand for on the menu?","S = Small · M = Medium · L = Large"],["03","What do you say if you want to take your drink home?","To go, please."]].map(([n,q,a],i)=>`<div class="card"><div class="qnum">QUESTION ${n}</div><h3>${q}</h3><button class="btn soft" onclick="reveal('wrap${i}')">Reveal suggested answer</button><div class="reveal" id="wrap${i}">${a}</div></div>`).join("")}</div>`;}
function feedback(){$("slide").innerHTML=`
 <div class="hero-grid"><div><div class="eyebrow">END OF LESSON · FEEDBACK</div><h1 style="font-size:clamp(40px,6vw,72px)">Great job,<br><span style="color:var(--coffee)">Sarah!</span></h1><p class="lead">You did a wonderful job today. Keep practising and see you next time!</p><div class="card" style="margin-top:15px"><h3>Today, you learned:</h3><p>✓ Food and drink vocabulary<br>✓ How to order politely<br>✓ How to ask about prices<br>✓ How to communicate at a coffee shop</p></div></div><div class="coffee-art"><div class="steam">〰 〰</div><div class="cup">☕</div><span class="decor d1">✦</span><span class="decor d2">★</span></div></div>
 <div class="card" style="margin-top:18px"><h3>Teacher feedback</h3><div class="drink-choice">${["Great pronunciation!","Good use of vocabulary!","Excellent communication!","Keep practising your speaking!"].map(x=>`<button class="choice" onclick="save();this.classList.toggle('active')">${x}</button>`).join("")}</div><textarea id="teacher-note" placeholder="Add a personal note for Sarah..." style="width:100%;min-height:65px;padding:12px;border:1px solid var(--line);border-radius:12px;font:17px 'Times New Roman',serif"></textarea><button class="btn primary" style="margin-top:12px" onclick="toast('Feedback noted for this session.')">Save feedback</button></div>`;}
function buildOverview(){$("slide-list").innerHTML=slides.map((s,i)=>`<button class="slide-link ${i===current?"current":""}" onclick="closeOverview();go(${i})"><small style="font:11px Arial;color:var(--blue)">SLIDE ${String(i+1).padStart(2,"0")}</small><br><strong>${s.name}</strong></button>`).join("");}
function closeOverview(){$("overlay").classList.remove("open");}
$("undo").onclick=undo;$("back").onclick=()=>go(current-1);$("next").onclick=next;
$("overview").onclick=()=>{buildOverview();$("overlay").classList.add("open")};$("close-menu").onclick=closeOverview;
$("overlay").onclick=e=>{if(e.target===$("overlay"))closeOverview()};
$("fullscreen").onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}};
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;if(e.key==="ArrowRight"&&current<slides.length-1)next();if(e.key==="ArrowLeft"&&current>0)go(current-1);if(e.key==="Escape")closeOverview();});
render();
</script>
</body></html>
